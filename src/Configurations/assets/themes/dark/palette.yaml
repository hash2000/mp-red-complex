version: "0.0.1"
name: palette
description: Тёмная тема (Dark)

# Палитра задаётся полностью, а не только «основными» ролями: неродной стиль
# (Fusion) и стандартные контролы рисуют кнопки, вкладки, рамки и подсказки по
# ролям QPalette. Незаданная роль берёт светлый системный цвет — из-за этого
# на другой машине появлялись белые кнопки и вкладки.
palette:
 Extends: [35, 35, 35]
 Base: [35, 35, 35]
