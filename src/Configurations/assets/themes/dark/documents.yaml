# ------------------------------------------------------------------
# Оформление вкладок документов в привязке к классу документа.
#
# Ключ — полное имя класса документа (WidgetTypeHandler::className)
# или его xtype из WidgetRegistry. Класс имеет приоритет над xtype.
# Один класс регистрируется один раз, поэтому xtype дублируется только
# для удобства: по нему проще найти запись по имени команды.
#
# Приоритет значений вкладки:
#   1. явные значения документа (панель свойств → «Цвет вкладки», «Значок»);
#   2. привязка по классу документа;
#   3. привязка по xtype;
#   4. default / defaultGlyph (здесь не заданы — вкладка остаётся в цвете
#      темы со стандартным глифом документа).
# ------------------------------------------------------------------
tabs:
  colors:
    # Системные настройки
    System.Documents.SystemOptions: "#8a7ae8"
    system-options: "#8a7ae8"

    # Редактор кода
    Content.TextEditor.CodeEditor: "#61afef"
    code-editor: "#61afef"
    Content.TextEditor.PagedText: "#61afef"
    text-editor: "#61afef"

    # SystemRouter
    Content.SystemRouter.SystemRouterTree: "#e06c75"
    system-router: "#e06c75"
    Content.SystemRouter.SystemRouterNodeProperties: "#c678dd"
    system-router-node-properties: "#c678dd"

    # DatabaseModule
    Content.Database.DatabaseBackup: "#4ec9b0"
    database-backup: "#4ec9b0"

    # FetchApi
    Content.FetchApi.FetchApi: "#98c379"
    fetch-api: "#98c379"
    Content.FetchApi.FetchQueriesTree: "#56b6c2"
    fetch-api-queries-tree: "#56b6c2"

    # Пользователи
    Content.Users.Login: "#d19a66"
    user-login: "#d19a66"
    Content.Users.Register: "#d19a66"
    user-register: "#d19a66"
    Content.Users.User: "#e5c07b"
    user-profile: "#e5c07b"

    # Панели оболочки
    System.Panels.ConsolePanel: "#7f9f7f"
    console: "#7f9f7f"
    System.Panels.Properties: "#abb2bf"
    properties: "#abb2bf"
    System.Panels.Explorer: "#e5c07b"
    explorer: "#e5c07b"
    System.Panels.Panel: "#5c6370"
    panel: "#5c6370"

  # Стандартные глифы вкладок. Раньше эти значения задавались при
  # регистрации типа в WidgetsBuilder; теперь оформление по умолчанию
  # живёт в теме.
  glyphs:
    # Системные настройки
    System.Documents.SystemOptions: "⚙"
    system-options: "⚙"

    # Редактор кода
    Content.TextEditor.CodeEditor: "📝"
    code-editor: "📝"
    Content.TextEditor.PagedText: "📝"
    text-editor: "📝"

    # SystemRouter
    Content.SystemRouter.SystemRouterTree: "🗂"
    system-router: "🗂"
    Content.SystemRouter.SystemRouterNodeProperties: "🛠"
    system-router-node-properties: "🛠"

    # DatabaseModule
    Content.Database.DatabaseBackup: "💾"
    database-backup: "💾"

    # FetchApi
    Content.FetchApi.FetchApi: "🌐"
    fetch-api: "🌐"
    Content.FetchApi.FetchQueriesTree: "🌳"
    fetch-api-queries-tree: "🌳"

    # Пользователи
    Content.Users.Login: "🔑"
    user-login: "🔑"
    Content.Users.Register: "📝"
    user-register: "📝"
    Content.Users.User: "👤"
    user-profile: "👤"

    # Панели оболочки
    System.Panels.ConsolePanel: "🖥"
    console: "🖥"
    System.Panels.Properties: "🛠"
    properties: "🛠"
    System.Panels.Explorer: "📁"
    explorer: "📁"
    System.Panels.Panel: "🗔"
    panel: "🗔"
