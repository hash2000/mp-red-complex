version: "0.0.1"
name: Entrypoint configuration
description: Стартовые настройки начинаются тут.

appearance:
  theme: dark
  application:
    name: base
    viewport:
      xtype: BaseViewport

stores:
  items:
    fetch_api:
      wal:
        checkInterval: 60000
        maxSizeMb: 40
    messages:
      wal:
        checkInterval: 60000
        maxSizeMb: 40
    accounts:
      wal:
        checkInterval: 120000
        maxSizeMb: 20
