version: "0.0.1"
name: Entrypoint configuration
description: Стартовые настройки начинаются тут.

# appearance — значения по умолчанию. При первом открытии профиля
# (profiles/default/appearance.yaml) они копируются в его настройки;
# дальше приложение читает профиль, и менять оформление можно там,
# не трогая эту конфигурацию.
appearance:
  theme: dark
  application:
    name: base
    viewport:
      xtype: BaseViewport

# Только перечисление хранилищ. Настройки каждого хранилища лежат отдельно
# в stores/<имя>.yaml (path, encrypted, wal, migrations). Чтобы отключить
# хранилище, уберите его имя из items — файл настроек останется на месте.
stores:
  items:
    - fetch_api
    - messages
    - system_router
    - accounts
    - game
