version: "0.0.1"
name: Entrypoint configuration
description: Стартовые настройки начинаются тут.

appearance:
  theme: dark
  application:
    name: base
    viewport:
      xtype: BaseViewport

stores:
  items:
    fetch_api:
      wal:
        checkInterval: 60000
        maxSizeMb: 40
      migrations:
        - version: 20251113181900
          description: Initialize database
          up: stores/migrations/fetch_api/20251113181900-up-Initialize-database.sql
          down: stores/migrations/fetch_api/20251113181900-down.sql
    messages:
      wal:
        checkInterval: 60000
        maxSizeMb: 40
    system_menu:
      wal:
        checkInterval: 60000
        maxSizeMb: 20
      migrations:
        - version: 20261119180000
          description: Initialize system menu
          up: stores/migrations/system_menu/20261119180000-up-Initialize-database.sql
          down: stores/migrations/system_menu/20261119180000-down.sql
    accounts:
      wal:
        checkInterval: 120000
        maxSizeMb: 20
      migrations:
        - version: 20251113181900
          description: Initialize database
          up: stores/migrations/accounts/20251113181900-up-Initialize-database.sql
          down: stores/migrations/accounts/20251113181900-down.sql
    game:
      encrypted: true
      migrations:
        - version: 20251113181900
          description: Initialize database
          up: stores/migrations/game/20251113181900-up-Initialize-database.sql
          down: stores/migrations/game/20251113181900-down.sql
