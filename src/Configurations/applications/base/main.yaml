### Описание приложения base.
### define — объявление класса виджета: name, extends, xtype, title, content.
### content у вьюпорта: documents / bottombar / sidebar.
###   documents (для одностраничного приложения) — открытые при загрузке документы:
###     showTabs (true по умолчанию) — панель открытых документов слева;
###     content — список документов в формате панелей (xtype, name, glyph, title, tooltip).
###   bottombar/sidebar — панель с default и списком content панелей;
###     delete: true — панель не создаётся, а добавление в неё пишет предупреждение.
### xtype панели ищется в WidgetRegistry (нативные классы из Launcher)
### или в yaml-описаниях, подключённых через requires.

define:
  name: BaseViewportForm
  extends: System.Viewport.MainForm
  xtype: BaseViewport
  title: Red Complex (mp)

  requires:
    - Views.FetchApi

  content:
    - bottombar:
        default: console
        content:
          - xtype: console
            name: console
            glyph: "🖥"
            title: Консоль

          - xtype: panel
            name: errors
            glyph: "📤"
            title: Вывод

          - xtype: panel
            name: output
            glyph: "⚠"
            title: Список ошибок

    - sidebar:
        default: system-menu
        content:
          - xtype: system-menu
            name: system-menu
            glyph: "🏢"
            title: Системное меню

          - xtype: explorer
            name: explorer
            glyph: "📁"
            title: Проводник

          - xtype: panel
            name: search
            glyph: "🔍"
            title: Поиск

          - xtype: panel
            name: git
            glyph: "🔀"
            title: Система контроля версий

          - xtype: properties
            name: properties
            glyph: "🛠"
            title: Свойства
