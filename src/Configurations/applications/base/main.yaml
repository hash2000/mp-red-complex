define:
	name: BaseViewportForm
  extends: Viewport.MainForm
	xtype: BaseViewport
  title: Base

  content:
    - bottombar:
		  default: console
			content:
			  - xtype: console
			    name:  console
				  glyph: 🖥
          title: Консоль
				- xtype: panel
			    name:  errors
				  glyph: 📤
          title: Вывод
				- xtype: panel
			    name:  output
				  glyph: ⚠
          title: Список ошибок
		- sidebar:
		  default: explorer
			content:
			  - xtype: explorer
			    name:  explorer
				  glyph: 📁
					title: Проводник
			  - xtype: panel
			    name:  search
				  glyph: 🔍
					title: Поиск
			  - xtype: panel
			    name:  git
				  glyph: 🔀
					title: Система контроля версий
			  - xtype: properties
			    name:  properties
				  glyph: 🛠
					title: Свойства
