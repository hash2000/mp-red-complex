### Описание приложения base.
### define — объявление класса виджета: name, extends, xtype, title, content.
### content у вьюпорта: documents / bottombar / sidebar.
###   documents (для одностраничного приложения) — открытые при загрузке документы:
###     showTabs (true по умолчанию) — панель открытых документов слева;
###     content — список документов в формате панелей (xtype, name, glyph, title, tooltip).
###   bottombar/sidebar — панель с default и списком content панелей;
###     collapsed (false по умолчанию) — состояние после загрузки:
###       bottombar свёрнута до полоски вкладок, sidebar — панели скрыты;
###     collapsable (true по умолчанию) — можно ли автоскрывать панель:
###       false убирает маленькую кнопку автоскрытия в полоске кнопок;
###     autohide (false по умолчанию) — панель после загрузки свёрнута
###       в тонкую полоску (bottombar — горизонтальную, sidebar — вертикальную)
###       и раскрывается при наведении; у sidebar вместе с ней скрываются панели;
###     closable (true по умолчанию, только bottombar) — можно ли скрыть панель:
###       false убирает пункт «Нижняя панель» (Ctrl+J) из меню «Вид»;
###     delete: true — панель не создаётся, а добавление в неё пишет предупреждение.
### xtype панели ищется в WidgetRegistry (нативные классы из Launcher)
### или в yaml-описаниях, подключённых через requires.

define:
  name: BaseViewportForm
  extends: System.Viewport.MainForm
  xtype: BaseViewport
  title: Red Complex (mp)

  requires:
    - Views.FetchApi

  content:
    - documents:
        content:
          - xtype: text-editor
            name: text-editor

    - bottombar:
        default: console
        content:
          - xtype: console
            name: console
            glyph: "🖥"
            title: Консоль

          - xtype: panel
            name: errors
            glyph: "📤"
            title: Вывод

          - xtype: panel
            name: output
            glyph: "⚠"
            title: Список ошибок

    - sidebar:
        default: system-router
        content:
          - xtype: system-router
            name: system-router
            glyph: "🧭"
            title: Системный маршрутизатор

          - xtype: database-backup
            name: database-backup
            glyph: "💾"
            title: Резервное копирование

          - xtype: explorer
            name: explorer
            glyph: "📁"
            title: Проводник

          - xtype: panel
            name: search
            glyph: "🔍"
            title: Поиск

          - xtype: panel
            name: git
            glyph: "🔀"
            title: Система контроля версий

          - xtype: properties
            name: properties
            glyph: "🛠"
            title: Свойства
