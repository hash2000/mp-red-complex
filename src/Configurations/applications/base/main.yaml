define:
  extends: Viewport.MainForm
	xtype: BaseViewport
  title: Base

  items:
    - bottombar:
		  default: console
			items:
			  - xtype: console
				  glyph: 🖥
          title: Консоль
				- xtype: errors
				  glyph: 📤
          title: Вывод
				- xtype: output
				  glyph: ⚠
          title: Список ошибок
		- sidebar:
		  default: explorer
			items:
			  - xtype: explorer
				  glyph: 📁
					title: Проводник
			  - xtype: search
				  glyph: 🔍
					title: Поиск
			  - xtype: git
				  glyph: 🔀
					title: Система контроля версий
			  - xtype: properties
				  glyph: 🛠
					title: Свойства
