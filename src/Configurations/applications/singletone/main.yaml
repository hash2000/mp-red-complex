### Описание приложения singletone — одностраничный документ.
### define — объявление класса виджета: name, extends, xtype, title, content.
### content у вьюпорта: documents / bottombar / sidebar.
###   documents  — открытые документы на момент загрузки приложения:
###                showTabs (true по умолчанию) — панель открытых документов слева;
###                content — список документов (xtype, name, glyph, title, tooltip).
###   bottombar  — нижняя панель: default и content панелей.
###   sidebar    — панель справа: default и content панелей.
###   delete: true у bottombar/sidebar — панель не создаётся, а добавление
###   в неё виджета (из yaml, команды или кода) пишет предупреждение в консоль.
### xtype ищется в WidgetRegistry (нативные классы из Launcher)
### или в yaml-описаниях, подключённых через requires.

define:
  name: SingletoneViewportForm
  extends: System.Viewport.MainForm
  xtype: SingletoneViewport
  title: Red Complex (mp)

  content:
    - documents:
        showTabs: false
        content:
          - xtype: console
            name: console
            glyph: "🖥"
            title: Консоль

    - bottombar:
        delete: true

    - sidebar:
        delete: true
